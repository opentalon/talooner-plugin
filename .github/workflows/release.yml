name: Release

# The bot consumes the generated contract package as a tagged dependency, so
# releases here are real semver tags (v0.1.0), not pseudo-versions. Push a tag
# to cut a release:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# This workflow reacts to the tag, verifies the tagged commit builds and tests
# clean, and publishes a GitHub Release for it. The tag itself is what `go get`
# resolves — see deployment.md, "plugin first, tag, then bump the action".

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
