syntax = "proto3";

// Package talooner.v1 is the Talooner action-payload contract.
//
// Talooner does not define its own gRPC service — OpenTalon fixes that in
// opentalon/proto/plugin.proto, and Talooner declares *actions* the host routes
// to Execute. What lives here are the payload shapes those actions exchange:
// requests are serialized into the ToolCallRequest.args map and the JSON
// `facts` arg; responses come back as JSON in ToolResultResponse
// structured_content (protocol.md). This proto is the typed contract the bot
// consumes as a tagged, generated Go package.
//
// Contract stability is a requirement. A tenant's callers are pinned
// independently and are not told when the cluster upgrades, so this contract
// stays backward-compatible across at least one major version: field numbers
// are append-only, existing fields never change type or meaning, and enum
// values are never renumbered.
package talooner.v1;

option go_package = "github.com/opentalon/talooner-plugin/proto/taloonerpb;taloonerpb";

// EvaluateMode selects how evaluate_pr reports its result.
enum EvaluateMode {
  EVALUATE_MODE_UNSPECIFIED = 0; // treated as EXECUTE
  EVALUATE_MODE_EXECUTE = 1;     // return an executable action list
  EVALUATE_MODE_PLAN = 2;        // return a plan only, never executable actions
}

// Verb is the abstract action vocabulary (engine.md, "Abstract action
// vocabulary"). The plugin returns verbs as data; the bot translates them to
// GitHub. The set is closed — validate_ruleset rejects any verb outside it.
//
// Retraction. Each evaluate_pr returns the COMPLETE current action set (full
// re-derivation, never a delta), so an action that fired before and is absent
// now has been retracted: its rule no longer matches the facts. The bot diffs
// the new set against what it previously executed and undoes the difference.
// The per-verb comments below say what that undo means; the plugin owns the
// full-state guarantee, the bot owns the GitHub effect.
enum Verb {
  VERB_UNSPECIFIED = 0;

  // approve target "pr". Fires only when no strict rule defeated it.
  // Retraction: the prior approval is withdrawn — the bot dismisses its review.
  VERB_APPROVE = 1;

  // block target "pr.merge".
  // Retraction: the block is lifted — Talooner no longer blocks the merge.
  VERB_BLOCK = 2;

  // comment target + text; {attr.x} interpolation already resolved.
  // Retraction: the bot keys its comment so re-posting is idempotent and an
  // absent comment can be resolved/hidden.
  VERB_COMMENT = 3;

  // assign target + assignee (an attr like "user.owner" arrives resolved to a
  // value, not the literal string).
  // Retraction: the assignment the bot made is removed.
  VERB_ASSIGN = 4;

  // require "review.<target>".
  // Retraction: the review requirement the bot added is dropped.
  VERB_REQUIRE = 5;

  // notify target + text; the bot dispatches through an OpenTalon channel.
  // Deferred bot-side to v1.5 (needs a configured channel), but the plugin
  // returns it and validate_ruleset accepts it. One-shot: a sent notification
  // cannot be unsent, so there is nothing to retract.
  VERB_NOTIFY = 6;

  // emit name; asserts event.<name>=true in the scope, no external effect.
  // Retraction: the event fact is re-derived each run like any bot fact, so
  // there is nothing external to undo.
  VERB_EMIT = 7;
}

// Severity classifies a diagnostic or warning.
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_ERROR = 1;
  SEVERITY_WARNING = 2;
  SEVERITY_INFO = 3;
}

// Action is one abstract action the engine decided should fire, with its
// arguments already resolved against the matched facts. Which scalar fields are
// set depends on the verb (see Verb).
//
// Interpolation is resolved before the action leaves the plugin: a text like
// "…{attr.user.owner}…" arrives filled in. One wrinkle: {item.<field>} resolves
// only for {item.name}; {item.id} renders literally, so templates use {id} or
// {attr.x}.
message Action {
  Verb verb = 1;
  string target = 2;   // approve/block/comment/assign/require target
  string text = 3;     // comment / notify text, interpolation resolved
  string assignee = 4; // assign: resolved user or team
  string name = 5;     // emit: event name
}

// Warning is a non-fatal condition surfaced alongside a decision (e.g. an
// unresolved approve/block tie that fired both).
message Warning {
  string code = 1;
  string message = 2;
}

// RuleFiring records one rule's contribution to a decision, for the audit
// trail. Extended as explain_pr (P-C5) and decision persistence (P-B9) land.
message RuleFiring {
  string rule = 1;
  string priority = 2;         // CRITICAL | HIGH | MEDIUM | LOW
  bool strict = 3;
  repeated string overrides = 4; // rules this one defeated
  bool defeated = 5;
}

// Explain is the human- and machine-readable account of why a decision came
// out the way it did.
message Explain {
  string summary = 1;
  repeated RuleFiring firings = 2;
}

// Diagnostic is one finding from validate_ruleset — a parse/compile error or a
// verb-vocabulary violation.
message Diagnostic {
  Severity severity = 1;
  string message = 2;
  int32 line = 3;
  int32 column = 4;
  string rule = 5;
}

// EvaluatePrRequest is the evaluate_pr payload. facts_json carries the extracted
// PR facts as JSON (the `facts` arg on the wire); the rest map to string args.
message EvaluatePrRequest {
  string repo = 1;
  int32 pr = 2;
  string head_sha = 3;
  string facts_json = 4;
  string ruleset = 5;
  EvaluateMode mode = 6;
  bool force = 7; // bypass the llm_review fact cache for this evaluation only
}

// EvaluatePrResponse is the decision. In execute mode `actions` is populated and
// `plan` is empty; in plan mode `plan` is populated and `actions` is empty —
// they are distinct fields so a plan can never be mistaken for something to run.
message EvaluatePrResponse {
  repeated Action actions = 1;
  repeated Action plan = 2;
  Explain explain = 3;
  repeated Warning warnings = 4;
}

// ValidateRulesetRequest / ValidateRulesetResponse back validate_ruleset.
message ValidateRulesetRequest {
  string ruleset = 1;
}

message ValidateRulesetResponse {
  bool valid = 1;
  repeated Diagnostic diagnostics = 2;
}

// WhoamiResponse is the capability handshake. protocol_version lets a caller
// fail fast on version skew; models/features let it know whether llm_review is
// available before loading a ruleset that depends on it.
message WhoamiResponse {
  string tenant = 1;
  uint32 protocol_version = 2;
  repeated string models = 3;
  repeated string features = 4;
  Quota quota = 5;
}

// Quota reports the tenant's LLM budget usage for the current window.
message Quota {
  int64 llm_calls_used = 1;
  int64 llm_calls_limit = 2;
}

// IsSubscribedResponse answers is_subscribed. subscribed is false for a PR that
// was never seen — not an error. since is the unix time (seconds) the current
// state was established, 0 when never set.
message IsSubscribedResponse {
  bool subscribed = 1;
  int64 since = 2;
}

// SetSubscriptionResponse answers set_subscription with the resulting state.
message SetSubscriptionResponse {
  bool subscribed = 1;
}

// AssertFactsResponse answers assert_facts. Store-only in v1 (decision 20): it
// reports which attributes were accepted and stored and which were rejected,
// and carries NO action list — the caller is a workflow run that exited long
// before this, and the plugin holds no GitHub credential, so a woken rule has
// nobody to act on. Accepted facts enter a verdict at the next evaluate_pr.
message AssertFactsResponse {
  repeated string accepted = 1;
  repeated RejectedFact rejected = 2;
}

// RejectedFact is one attribute assert_facts refused, with why.
message RejectedFact {
  string attribute = 1;
  string reason = 2;
}
